{# Custom sidebar template for Furo - includes search and API classes #}

{% import 'theme' as theme %}

<!-- Search bar in sidebar -->
<div class="rst-footer-buttons search-form bd-sidebar" role="navigation">
    <form id="search-form" action="{{ pathto('searchindex.html', 1) }}?q=", method="GET">
        <input type="text" name="q" id="search-field" autocomplete="off" placeholder="Rechercher..."/>
    </form>
</div>

<!-- API Classes list - auto-generated from safecor module -->
<section class="bd-docs-navbar-custom api-sidebar">
  <h5>Classes API S&uuml;&grave;re</h5>
  
  <!-- List items will be injected by theme.sidebar_items below -->
  {% for title in themesidebar_items %}
    {{ '<li><a href="' + title.url + '" class="reference internal">' }}{{ '<span>' + title.text + '</span>' }}</a></li>' }}
  {# }% endfor %}
</section>

# Qt Quick Controls 2 theme for the Safecor operator console.
#
# This file is the theme customisation point, pointed at by the
# QT_QUICK_CONTROLS_CONF environment variable (see gui.py). It is read before
# the QGuiApplication is created, so edits only take effect on restart.
#
#   * "Style" selects the Qt Quick Controls 2 style (Material, iOS, Universal...).
#   * A "[<Style>]" section with "Palette\..." entries overrides that style's
#     default palette. Any entry not overridden still follows the system
#     light/dark colour scheme (see _apply_theme in gui.py).
#
# Example: to switch to the iOS style, set "Style=iOS" and uncomment the
# "[iOS]" palette block below.

[Controls]
Style=iOS

[iOS]
#Palette\Window=#F2F2F7
#Palette\WindowText=#1C1C1E
#Palette\Base=#FFFFFF
#Palette\AlternateBase=#E5E5EA
#Palette\Text=#1C1C1E
#Palette\Button=#E5E5EA
#Palette\ButtonText=#007AFF
#Palette\Highlight=#007AFF
#Palette\HighlightedText=#FFFFFF
#Palette\PlaceholderText=#8E8E93

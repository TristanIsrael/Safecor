name: Get dependency from the workflow artifacts

inputs:
  name:
    description: The name of the dependency
    required: true

runs:
  using: composite  

  steps:
    - name: Download py3-paho-mqtt2 dependecy
      uses: actions/download-artifact@v4
      with:
        path: downloads
        name: ${{ github.event.inputs.name }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Uncompress and copy packages
      shell: sh
      env:
        FILENAME: ${{ inputs.name }}
      run: |
        cd $GITHUB_WORKSPACE/downloads
        if [ -d "$FILENAME" ]; then
          cd "$FILENAME"
        fi
        mkdir -p /home/builder/packages/safecor/x86_64
        mkdir -p /home/builder/packages/safecor/noarch
        # Copy packages to the correct architecture directory
        find . -name "*.apk" -exec sh -c '
          if echo "$1" | grep -q "/noarch/"; then
            cp "$1" /home/builder/packages/safecor/noarch/
          else
            cp "$1" /home/builder/packages/safecor/x86_64/
          fi
        ' _ {} \;

    - name: Rebuild and sign the APK index
      shell: sh
      run: |
        for ARCH in x86_64 noarch; do
          DIR="/home/builder/packages/safecor/${ARCH}"
          if ls "${DIR}"/*.apk 1>/dev/null 2>&1; then
            cd "${DIR}"
            apk index -d Safecor -o APKINDEX.tar.gz *.apk
            abuild-sign -k /home/builder/.abuild/safecor.rsa -p /etc/apk/keys/safecor.rsa.pub APKINDEX.tar.gz
          fi
        done

    - name: Update repository configuration
      shell: sh
      run: |
        LINE="/home/builder/packages/safecor"
        FILE="/etc/apk/repositories"
        if grep -q "^$LINE\$" "$FILE"; then
          echo "Local repository is already set"
        else
          echo "Adding local repository"
          echo "$LINE" | sudo tee -a $FILE
        fi
        sudo apk update

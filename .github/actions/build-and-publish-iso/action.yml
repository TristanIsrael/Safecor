name: Build and publish ISO

inputs:
  privkey:
    description: Base64 encoded SSH private key
    required: true
  package-name:
    description: The name of the package to create
    required: true
  alpine-version:
    description: The version of Alpine Linux to package with
    requierd: false
    default: 3.24
  branch:
    description: Target branch for the publish path (main uses stable, others use edge)
    required: false
    default: "main"

runs:
  using: composite  

  steps:
  - name: Install build packages 
    shell: sh 
    run: |
      sudo apk add abuild alpine-conf xorriso squashfs-tools grub alpine-sdk wget mtools imagemagick

  - name: Fetch aports git repository
    shell: sh
    env:
      ALPINE_VERSION: ${{ inputs.alpine-version }}
    run: |
      #git clone --depth=1 https://gitlab.alpinelinux.org/alpine/aports.git
      wget https://github.com/alpinelinux/aports/archive/refs/heads/$ALPINE_VERSION-stable.tar.gz
      tar xf $ALPINE_VERSION-stable.tar.gz

  # Unneeded in 3.24 - patches have been submitted upstream and applied
  #- name: Apply patches
  #  shell: sh
  #  run: |
  #    sudo chmod +x setup/iso/patches/apply-patches.sh
  #    sudo setup/iso/patches/apply-patches.sh "$PWD/setup/iso/patches"

  - name: Build ISO 
    shell: sh
    env:
      ALPINE_VERSION: ${{ inputs.alpine-version }}
    run: |
      # Copy scripts
      cp setup/iso/mkimg.safecor.sh aports-$ALPINE_VERSION-stable/scripts
      cp setup/iso/genapkovl-safecor.sh aports-$ALPINE_VERSION-stable/scripts
      cp setup/iso/${{ inputs.package-name }}/*.sh aports-$ALPINE_VERSION-stable/scripts
      sudo chmod +x aports-$ALPINE_VERSION-stable/scripts/*.sh

      # Copy splash images
      cp setup/iso/splash.ppm aports-$ALPINE_VERSION-stable/scripts || true # Default Safecor Splash
      cp setup/iso/${{ inputs.package-name }}/splash.* aports-$ALPINE_VERSION-stable/scripts || true

      mkdir -pv ~/tmp

      cd aports-$ALPINE_VERSION-stable/scripts
      TMPDIR=~/tmp ./mkimage.sh --tag v${{ inputs.alpine-version }} --outdir ~/iso --arch x86_64 --repository https://www.alefbet.net/github/safecor --repository http://dl-cdn.alpinelinux.org/alpine/v${{ inputs.alpine-version }}/main --repository http://dl-cdn.alpinelinux.org/alpine/v${{ inputs.alpine-version }}/community --profile ${{ inputs.package-name }} --hostkeys --workdir ~/tmp
      mv ~/iso/alpine-${{ inputs.package-name }}-v${{ inputs.alpine-version }}-x86_64.iso ~/iso/safecor-${{ inputs.package-name }}-x86_64.iso
      rm -rf ~/tmp
  
  - name: Publish ISO
    uses: ./.github/actions/publish
    with:
      privkey: ${{ inputs.privkey }}
      filepath: ~/iso/safecor-${{ inputs.package-name }}-x86_64.iso
      is_package: false
      branch: ${{ inputs.branch }}
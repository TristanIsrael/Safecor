user mosquitto
log_dest syslog

# Unix domain sockets listeners
# mqtt-local: debug tooling (show-messages.sh, show-commands.sh, ...)
# mqtt-dom0: Dom0 side of the platform (Dom0Controller, ...)
listener 0 /tmp/mqtt-local.sock
listener 0 /tmp/mqtt-dom0.sock

# Per-domain listeners, generated from the product topology at the end of
# the product installation (see generate-mosquitto-listeners.py)
include /etc/mosquitto/conf.d/safecor-listeners.conf

# TCP socket debug listener
listener 1883
protocol mqtt

allow_anonymous true
#persistent_client_expiration 0
max_keepalive 0

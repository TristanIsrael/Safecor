# Run with $  docker-compose -f docker-compose.yml --profile network_boot --env-file safecor.env up
services:
  # The repository should be created first because we need the packages to build
  # the custom dnsmasq image for DHCP
  repository:
    image: httpd:2.4
    volumes:
      - ${LOCAL_REPOSITORY_PATH}:/var/www/html
      - ./conf/repository.conf:/etc/apache2/conf/extra/repository.conf
    ports: ["${REPOSITORY_WEB_PORT}:80"]
    restart: unless-stopped
    command: >
      sh -c "
      echo 'Include /etc/apache2/conf/extra/repository.conf' >> /usr/local/apache2/conf/httpd.conf &&
      httpd-foreground
      "

    # The repository is created for all profiles
    profiles: ["network_boot", "offline", "local_cache"]

  dhcp:
    #build:
    #  context: .
    #  args:
    #    REPOSITORY_SERVER_IP: ${REPOSITORY_SERVER_IP}
    #    ALPINE_VERSION: ${ALPINE_VERSION}
    #  dockerfile: dnsmasq.dockerfile
    image: alpine:latest
    depends_on:
      - repository
    ports: ["${DHCP_WEB_PORT}:8080"]
    environment:
      - DHCP_RANGE_BEGIN=${DHCP_RANGE_BEGIN}
      - DHCP_RANGE_END=${DHCP_RANGE_END}
      - TFTP_SERVER_IP=${TFTP_SERVER_IP}
    cap_add:
      - NET_ADMIN
    volumes:
      - ${LOCAL_REPOSITORY_PATH}:/mnt/repository
      - ./conf/dnsmasq.conf.template:/etc/dnsmasq.conf.template
      - ./data/tftp:/tftp
      - ./conf/repositories:/etc/apk/repositories      
    restart: unless-stopped
    networks:
      pxe_net:
        ipv4_address: ${DHCP_SERVER_IP}
    command:
      sh -c "envsubst < /etc/dnsmasq.conf.template > /etc/dnsmasq.conf
      && dnsmasq -k"
    #profiles: ["network_boot"]
    profiles: ["none"]


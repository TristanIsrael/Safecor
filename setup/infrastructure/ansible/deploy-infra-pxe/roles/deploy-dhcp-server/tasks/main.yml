---

- name: Installation of the packages
  apk: 
    name: dnsmasq
    state: present
 
- name: Configuration of the service
  template:
    src: dnsmasq.conf.j2
    dest: "/etc/dnsmasq.conf"
    mode: 0750
    owner: root
    group: root

- name: Start the service
  service:
    name: "dnsmasq"
    state: restarted
    enabled: true    
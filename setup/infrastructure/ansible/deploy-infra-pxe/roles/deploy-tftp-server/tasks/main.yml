---
 
- name: Install the TFTP server
  apk: 
    name: tftp-hpa
    state: present

- name: Configure the TFTP server
  template:
    src: in.tftpd.j2
    dest: "/etc/conf.d/in.tftpd"
    mode: 0644
    owner: root
    group: root

- name: Declare data directory
  stat:
    path: /srv/tftp/themes/safecor
  register: datadir

- name: Verify the TFTP directories
  debug:
    msg: "The directory exists"
  when: datadir.stat.exists

- name: Create the TFTP directories
  file:
    path: /srv/tftp/themes/safecor
    state: directory
    mode: 0775
    owner: root
    group: root
  when: not datadir.stat.exists


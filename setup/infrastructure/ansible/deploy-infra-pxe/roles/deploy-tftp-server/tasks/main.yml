- name: Install GRUB
  apk: 
    name: grub-efi
    state: present

- name: Create the GRUB bootloader 
  shell: |
    cd /srv/tftp
    grub-mkimage -O x86_64-efi -o grubx64.efi -p / net efinet tftp http configfile normal multiboot2 gzio fat ext2 multiboot echo efi_gop efi_uga all_video png gfxterm gfxterm_background gfxmenu

- name: Copy the GRUB configuration file
  template:
    src: grub.cfg.j2
    dest: "/srv/tftp/grub.cfg"
    mode: 0644
    owner: root
    group: root

- name: Create the GRUB font
  shell: |
    cd /srv/tftp
    grub-mkfont -o font.pf2 -s 24 /usr/share/fonts/misc/ter-u24b.otb

- name: Copy the splash image
  copy:
    src: splash_ng.png
    dest: /srv/tftp/themes/safecor/splash.png
    mode: 0644

- name: Copy the GRUB theme
  copy:
    src: theme.txt
    dest: /srv/tftp/themes/safecor/theme.txt 
    mode: 0644

- name: Restart the services
  service:
    name: "in.tftpd"
    state: restarted
    enabled: true    
    